name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Maven
        working-directory: Backend/coderabhishek
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push services
        working-directory: Backend/coderabhishek
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker compose build

          docker tag react-frontend:1.0 "$DOCKER_USERNAME/coderabhishek:react-frontend"
          docker tag eureka:1.0 "$DOCKER_USERNAME/coderabhishek:eureka"
          docker tag gateway:1.0 "$DOCKER_USERNAME/coderabhishek:gateway"
          docker tag auth:1.0 "$DOCKER_USERNAME/coderabhishek:auth"
          docker tag blog:1.0 "$DOCKER_USERNAME/coderabhishek:blog"

          docker push "$DOCKER_USERNAME/coderabhishek:react-frontend"
          docker push "$DOCKER_USERNAME/coderabhishek:eureka"
          docker push "$DOCKER_USERNAME/coderabhishek:gateway"
          docker push "$DOCKER_USERNAME/coderabhishek:auth"
          docker push "$DOCKER_USERNAME/coderabhishek:blog"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MONGO_URI,DOCKER_PASSWORD,DOCKER_USERNAME
          script: |
            set -euo pipefail

            if [[ -z "${MONGO_URI:-}" ]]; then
              echo "ERROR: MONGO_URI is not set. Aborting deployment."
              exit 1
            fi

            printf '%s' "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            declare -A services=(
              ["eureka"]="8761"
              ["gateway"]="8080"
              ["auth"]="8081"
              ["blog"]="8082"
              ["react-frontend"]="80"
            )

            image_repo="$DOCKER_USERNAME/coderabhishek"

            for service in "${!services[@]}"; do
              echo "Pulling $service image"
              docker pull "$image_repo:$service"
            done

            for service in "${!services[@]}"; do
              docker ps -q --filter "name=^${service}$" | grep -q . && docker stop "$service" || true
              docker ps -aq --filter "name=^${service}$" | grep -q . && docker rm "$service" || true
            done

            docker network inspect mynetwork >/dev/null 2>&1 || docker network create mynetwork

            for service in "${!services[@]}"; do
              echo "Starting $service on port ${services[$service]}"

              if [[ "$service" == "blog" || "$service" == "auth" ]]; then
                docker run -d --restart unless-stopped --name "$service" \
                  --network mynetwork \
                  -p "${services[$service]}:${services[$service]}" \
                  -e MONGO_URI \
                  "$image_repo:$service"
              else
                docker run -d --restart unless-stopped --name "$service" \
                  --network mynetwork \
                  -p "${services[$service]}:${services[$service]}" \
                  "$image_repo:$service"
              fi
            done

            echo "Deployment completed successfully"
